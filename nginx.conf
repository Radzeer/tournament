server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router (BrowserRouter) miatt minden ismeretlen útvonalat
    # az index.html-re irányítunk, hogy a /admin közvetlen betöltése
    # (nem a főoldalról navigálva) is működjön.
    location / {
        try_files $uri /index.html;
    }

    # Statikus asset-ek gyorsítótárazása
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
